<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event</title>
    <style>
        body {
            background-color: black;
            color: white;
        }
        div{
            background-color: yellow;
            height: 100px;
            width: 100px;
            margin: 100px;
        }
    </style>
</head>

<body>
    <h1>We are learning event</h1>
    <!-- <button onclick="changeToDark()">light</button> -->
    <!-- <button onmouseover="ChangeToLight()">dark</button>
    <div onmouseover="bgcolor()" onmouseleave="bgchange1()">Div</div> -->
    <button id = 'bt1'>Dark</button>
    <button id = 'bt2'>Light</button>
<script>
let bt1 = document.querySelector('#bt1')
let bt2 = document.querySelector('#bt2')

    // let changeToDark = ()=>{
        // document.body.style.backgroundColor = "black"
        // document.body.style.backgroundColor = "white"
    
    // }
    // let ChangeToLight =()=>{
        // document.body.style.backgroundColor = "white"
        // document.body.style.backgroundColor = "black"
    // }

    bt1.addEventListener('click', ()=>{
        document.body.style.backgroundColor = "black"
        document.body.style.backgroundColor = "white"
    })
    bt2.addEventListener('mouseover', ()=>{
        document.body.style.backgroundColor = "white"
        document.body.style.backgroundColor = "black"
    })


    let bgcolor = ()=>{
        let div =document.querySelector('div')
        div.style.background = 'yellow'
    }
    let bgchange1 =()=>{
        let div = document.querySelector('div')
        div.style.background='blue'
    }
</script>
</body>

</html>
